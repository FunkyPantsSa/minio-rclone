# deploy/secret.yaml —— rclone 凭证 Secret（AK/SK 通过环境变量注入备份 Pod）
#
# ⚠️ 使用前必读：
#   1) 将 YOUR_ACCESS_KEY / YOUR_SECRET_KEY 替换为真实的 MinIO 凭证；
#   2) 使用 stringData，kubectl apply 后 K8s 会自动以 base64 存储；
#   3) 对应 rclone.conf 的 env_auth = true 与 backup-controller-config 的
#      CREDENTIALS_SECRET: rclone-secret。
#
# 应用：kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: rclone-secret
  namespace: middleware
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ACh5Jnh4CTxeg9DK3BAN33Pt
  AWS_SECRET_ACCESS_KEY: AKJKSARUuMarPPcVE5KZBX54TB79bMBJdR2E
