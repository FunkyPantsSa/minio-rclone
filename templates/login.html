<!DOCTYPE html>
<!--
  templates/login.html —— 登录页面
  通过 POST /api/login 校验（后端下发 HttpOnly 会话 Cookie），成功后跳转首页。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - MinIO 备份控制台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #1e272e;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .login-box {
    background: #fff; border-radius: 8px; padding: 36px 40px;
    width: 360px; box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  h1 { font-size: 20px; color: #2c3e50; text-align: center; }
  .sub { color: #7f8c8d; font-size: 13px; text-align: center; margin: 6px 0 24px; }
  input {
    width: 100%; padding: 10px 12px; margin-bottom: 12px;
    border: 1px solid #dcdfe1; border-radius: 4px; font-size: 14px;
  }
  input:focus { outline: none; border-color: #3498db; }
  button {
    width: 100%; padding: 10px; border: none; border-radius: 4px;
    background: #3498db; color: #fff; font-size: 15px; cursor: pointer;
  }
  button:hover { opacity: .9; }
  .err { color: #e74c3c; font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }
</style>
</head>
<body>
<div class="login-box">
  <h1>MinIO 备份控制台</h1>
  <p class="sub">基于 rclone 的备份管理 · 请登录</p>
  <form id="loginForm">
    <input type="text" id="username" placeholder="用户名" autocomplete="username" required>
    <input type="password" id="password" placeholder="密码" autocomplete="current-password" required>
    <button type="submit">登 录</button>
  </form>
  <p id="err" class="err"></p>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || '登录失败');
    location.href = '/'; // 登录成功跳转首页
  } catch (ex) {
    err.textContent = ex.message;
  }
});
</script>
</body>
</html>
